name: Additional Exit Signal Research

on:
  push:
    branches:
      - rsi-exit-test
    paths:
      - additional_exit_signal_backtest.py
      - .github/workflows/additional-exit-signal-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: additional-exit-signal-research
  cancel-in-progress: true

jobs:
  research:
    name: Supertrend Chop Donchian OBV screen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
        with:
          ref: rsi-exit-test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run additional exit signal screen
        run: |
          python additional_exit_signal_backtest.py | tee additional_exit_signal_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-exit-signal-results
          path: additional_exit_signal_results.txt
          if-no-files-found: error

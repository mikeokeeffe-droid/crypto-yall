name: Audit All Three Bot States

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependency
        run: python -m pip install requests
      - name: Check all three state files
        run: python scripts/audit_all_three_states.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}

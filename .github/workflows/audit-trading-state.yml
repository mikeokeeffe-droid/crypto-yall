name: Audit Existing Trading State

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependency
        run: python -m pip install requests
      - name: Validate Gist state without modifying it
        run: python scripts/audit_gist_state.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}

name: Backup Three Gists to Supabase

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Save and independently verify private snapshots
        run: python scripts/backup_gists_to_supabase.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

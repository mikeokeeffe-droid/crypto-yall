name: Check Hyperliquid Markets

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Hyperliquid markets
        run: python test_hl_markets.py
        env:
          HL_TESTNET: ${{ vars.HL_TESTNET }}

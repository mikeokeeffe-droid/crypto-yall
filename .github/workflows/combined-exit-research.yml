name: Combined DMI ADX ATR EMA Exit Research

on:
  push:
    branches:
      - rsi-exit-test
    paths:
      - combined_exit_candidate_backtest.py
      - .github/workflows/combined-exit-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-exit-research
  cancel-in-progress: true

jobs:
  backtest:
    name: Combined exit candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
        with:
          ref: rsi-exit-test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run combined exit research
        run: |
          python combined_exit_candidate_backtest.py | tee combined_exit_candidate_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-exit-candidate-results
          path: combined_exit_candidate_results.txt
          if-no-files-found: error

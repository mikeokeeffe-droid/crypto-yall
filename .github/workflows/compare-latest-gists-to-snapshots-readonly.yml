name: Compare Latest Gists to Verified Snapshots Read Only

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Compare latest Gist versions and hashes with verified snapshots
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ vars.AGGRESSIVE_GIST_ID }}
          INTRADAY_GIST_ID: ${{ vars.INTRADAY_GIST_ID }}
          GIST_ID: ${{ vars.GIST_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/compare_latest_gists_to_snapshots_readonly.py

name: Apply Crypto Forge Labs Cron Cleanup

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Crypto Forge Labs cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          def textwrap_dedent(value):
              import textwrap
              return textwrap.dedent(value).lstrip("\n")

          def read(path):
              p = ROOT / path
              if not p.exists():
                  raise SystemExit(f"Required file missing: {path}")
              return p.read_text(encoding="utf-8")

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")
              print(f"Updated {path}")

          def replace_required(text, old, new, label):
              if old not in text:
                  print(f"Note: pattern already changed or not present: {label}")
                  return text
              return text.replace(old, new)

          # ------------------------------------------------------------------
          # 1) notifier.py — branding + scheduler/Gist wording
          # ------------------------------------------------------------------
          path = "notifier.py"
          t = read(path)
          t = t.replace("Crypto Y'all", "Crypto Forge Labs")
          t = t.replace("Crypto Yall", "Crypto Forge Labs")
          t = t.replace(
              "Runs via GitHub Actions cron. Checks all assets for signal transitions",
              "Can be triggered by the hosted scheduler service. Checks all assets for signal transitions"
          )
          t = t.replace(
              "ID of the private Gist for state persistence",
              "ID of the secret/unlisted Gist for state persistence"
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 2) hyperliquid_executor.py — branding + safer fallback
          # ------------------------------------------------------------------
          path = "hyperliquid_executor.py"
          t = read(path)
          t = t.replace("Crypto Y'all", "Crypto Forge Labs")
          t = t.replace("Crypto Yall", "Crypto Forge Labs")
          t = t.replace(
              "Runs daily via GitHub Actions, enforces risk guardrails, and sends",
              "Can be triggered by the hosted scheduler service, enforces risk guardrails, and sends"
          )
          t = t.replace(
              'SEGREGATED_CAPITAL  – USDC allocated to bot (e.g. "10000")',
              'SEGREGATED_CAPITAL  – USDC allocated to bot (e.g. "1000")'
          )
          t = t.replace(
              'os.environ.get("SEGREGATED_CAPITAL", "10000")',
              'os.environ.get("SEGREGATED_CAPITAL", "1000")'
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 3) intraday_executor.py — scheduler wording + safer fallback
          # ------------------------------------------------------------------
          path = "intraday_executor.py"
          t = read(path)
          t = t.replace(
              "intraday_executor.py — Hourly trade executor using the 1h 2-pole oscillator.",
              "intraday_executor.py — Intraday trade executor using the 1h 2-pole oscillator."
          )
          t = t.replace(
              'os.environ.get("INTRADAY_CAPITAL", "5000")',
              'os.environ.get("INTRADAY_CAPITAL", "500")'
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 4) aggressive_executor.py — scheduler wording + safer fallback
          # ------------------------------------------------------------------
          path = "aggressive_executor.py"
          t = read(path)
          t = t.replace(
              "aggressive_executor.py — 30-min trade executor with pyramiding.",
              "aggressive_executor.py — Aggressive trade executor with pyramiding."
          )
          t = t.replace(
              "AGGRESSIVE_CAPITAL                  (capital pool, e.g. 3000)",
              "AGGRESSIVE_CAPITAL                  (capital pool, e.g. 300)"
          )
          t = t.replace(
              'os.environ.get("AGGRESSIVE_CAPITAL", "3000")',
              'os.environ.get("AGGRESSIVE_CAPITAL", "300")'
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 5) app.py — remove original visible branding/logo dependency
          # ------------------------------------------------------------------
          path = "app.py"
          t = read(path)
          t = t.replace("Crypto Y'all", "Crypto Forge Labs")
          t = t.replace("Crypto Yall", "Crypto Forge Labs")
          t = t.replace(
              'page_title="Crypto Forge Labs — Regime Dashboard",\n'
              '    page_icon="assets/cryptoyall-main-3d-inverted-rgb-775px@72ppi.png",',
              'page_title="Crypto Forge Labs — Regime Dashboard",\n'
              '    page_icon="⚒️",'
          )
          t = t.replace(
              'st.sidebar.image("assets/cryptoyall-main-3d-inverted-rgb-775px@72ppi.png", width="stretch")',
              'st.sidebar.markdown("## ⚒️ Crypto Forge Labs")'
          )
          t = t.replace(
              'value=10_000, step=1_000, format="%d",',
              'value=1_000, step=100, format="%d",'
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 6) trading_state.py — secret Gist terminology
          # ------------------------------------------------------------------
          path = "trading_state.py"
          t = read(path)
          t = t.replace(
              "The executors write state to private Gists; this module fetches them",
              "The executors write state to secret/unlisted Gists; this module fetches them"
          )
          write(path, t)

          # ------------------------------------------------------------------
          # 7) test_trade.py — privacy-safe logs
          # ------------------------------------------------------------------
          path = "test_trade.py"
          t = read(path)

          # Do not print the full Hyperliquid account address.
          t = t.replace(
              'print(f"Account: {account_address}")',
              'print("Account: configured (address hidden from logs)")'
          )
          t = t.replace(
              'print(f"   - Authenticated as {account_address}")',
              'print("   - Authentication confirmed (address hidden from logs)")'
          )

          # Avoid dumping raw API/order/position objects into public logs.
          t = t.replace(
              'print(f"Open response: {resp}")',
              'print("Open order submitted; checking fill/position status")'
          )
          t = t.replace(
              'print(f"Position confirmed: {positions[0]}")',
              'print("Position confirmed on Hyperliquid")'
          )
          t = t.replace(
              'print(f"Close response: {close_resp}")',
              'print("Close order submitted")'
          )

          write(path, t)

          # ------------------------------------------------------------------
          # 8) New Render HTTP trigger service for cron-job.org
          # ------------------------------------------------------------------
          cron_server = r"""\
          import hmac
          import os
          import subprocess
          import sys
          import threading
          from datetime import datetime, timezone

          from flask import Flask, jsonify, request

          app = Flask(__name__)

          JOBS = {
              "daily": "hyperliquid_executor.py",
              "intraday": "intraday_executor.py",
              "aggressive": "aggressive_executor.py",
              "signals": "notifier.py",
              "test-trade": "test_trade.py",
          }

          locks = {name: threading.Lock() for name in JOBS}
          status = {
              name: {
                  "running": False,
                  "last_started": None,
                  "last_finished": None,
                  "last_exit_code": None,
              }
              for name in JOBS
          }


          def utc_now():
              return datetime.now(timezone.utc).isoformat()


          def authorized():
              expected = os.environ.get("CRON_SECRET", "")
              supplied = request.headers.get("X-Cron-Secret", "")
              if not expected:
                  return False
              return hmac.compare_digest(supplied, expected)


          def run_job(name):
              lock = locks[name]
              if not lock.acquire(blocking=False):
                  print(f"[{name}] skipped: job already running", flush=True)
                  return

              try:
                  status[name]["running"] = True
                  status[name]["last_started"] = utc_now()
                  print(f"[{name}] started at {status[name]['last_started']}", flush=True)

                  result = subprocess.run(
                      [sys.executable, JOBS[name]],
                      env=os.environ.copy(),
                      check=False,
                      timeout=60 * 20,
                  )

                  status[name]["last_exit_code"] = result.returncode
                  print(f"[{name}] finished with exit code {result.returncode}", flush=True)

              except subprocess.TimeoutExpired:
                  status[name]["last_exit_code"] = 124
                  print(f"[{name}] timed out after 20 minutes", flush=True)

              except Exception as exc:
                  status[name]["last_exit_code"] = 1
                  print(f"[{name}] failed: {exc}", flush=True)

              finally:
                  status[name]["running"] = False
                  status[name]["last_finished"] = utc_now()
                  lock.release()


          @app.get("/")
          @app.get("/health")
          def health():
              return jsonify(
                  service="Crypto Forge Labs scheduler",
                  status="ok",
                  scheduler="cron-job.org",
              )


          @app.post("/run/<name>")
          def trigger(name):
              if name not in JOBS:
                  return jsonify(error="Unknown job"), 404

              if not authorized():
                  return jsonify(error="Unauthorized"), 401

              if locks[name].locked():
                  return jsonify(
                      status="already-running",
                      job=name,
                  ), 409

              thread = threading.Thread(
                  target=run_job,
                  args=(name,),
                  daemon=True,
                  name=f"crypto-forge-{name}",
              )
              thread.start()

              return jsonify(
                  status="accepted",
                  job=name,
                  started=utc_now(),
              ), 202


          @app.get("/status/<name>")
          def job_status(name):
              if name not in JOBS:
                  return jsonify(error="Unknown job"), 404

              if not authorized():
                  return jsonify(error="Unauthorized"), 401

              return jsonify(job=name, **status[name])


          if __name__ == "__main__":
              port = int(os.environ.get("PORT", "10000"))
              app.run(host="0.0.0.0", port=port)
          """
          cron_server = textwrap_dedent(cron_server)
          write("cron_server.py", cron_server)

          # ------------------------------------------------------------------
          # 9) requirements.txt — add web service dependencies
          # ------------------------------------------------------------------
          path = "requirements.txt"
          t = read(path)
          reqs = [line.strip().lower() for line in t.splitlines() if line.strip()]
          if not any(r.startswith("flask") for r in reqs):
              t = t.rstrip() + "\nflask>=3.0\n"
          if not any(r.startswith("gunicorn") for r in reqs):
              t = t.rstrip() + "\ngunicorn>=22.0\n"
          write(path, t)

          # ------------------------------------------------------------------
          # 10) render.yaml — optional Render Blueprint
          # ------------------------------------------------------------------
          render_yaml = """\
          services:
            - type: web
              name: crypto-forge-scheduler
              runtime: python
              buildCommand: pip install -r requirements.txt
              startCommand: gunicorn cron_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
              healthCheckPath: /health
          """
          write("render.yaml", textwrap_dedent(render_yaml))

          # ------------------------------------------------------------------
          # 11) Remove automatic GitHub schedules.
          #     Keep workflow_dispatch as a manual fallback only.
          # ------------------------------------------------------------------
          workflow_paths = [
              ".github/workflows/execute-trades.yml",
              ".github/workflows/execute-intraday.yml",
              ".github/workflows/execute-aggressive.yml",
              ".github/workflows/signal-check.yml",
          ]

          for wf in workflow_paths:
              p = ROOT / wf
              if not p.exists():
                  print(f"Note: workflow not found, skipping: {wf}")
                  continue
              x = p.read_text(encoding="utf-8")

              # Replace the complete "on: schedule + workflow_dispatch" block
              # up to the blank line before jobs.
              x2 = re.sub(
                  r"(?ms)^on:\n.*?(?=^jobs:\n)",
                  "on:\n  workflow_dispatch: {}  # Manual fallback; scheduling is handled by cron-job.org via Render\n\n",
                  x,
                  count=1,
              )
              if x2 == x:
                  print(f"Note: no scheduled trigger block changed in {wf}")
              else:
                  p.write_text(x2, encoding="utf-8")
                  print(f"Disabled GitHub schedule in {wf}")

          # ------------------------------------------------------------------
          # 12) User-facing scheduler guide
          # ------------------------------------------------------------------
          scheduler_guide = r"""\
          # Crypto Forge Labs — Render + cron-job.org Scheduler Setup

          Crypto Forge Labs uses **Render** to host the bot trigger service and
          **cron-job.org** to call the bot on a schedule.

          GitHub remains the home of the code, but GitHub Actions is **not**
          used for automatic scheduling. The existing Actions workflows remain
          available as manual fallbacks.

          ## Websites to use

          - **Render:** https://render.com
            - Hosts the Crypto Forge Labs Python service.
            - Stores the bot's environment variables and secrets.
            - Gives you an `onrender.com` URL.

          - **cron-job.org:** https://cron-job.org
            - Sends scheduled HTTPS POST requests to your Render service.
            - This replaces the automatic GitHub Actions cron schedules.

          - **Hyperliquid:** https://app.hyperliquid.xyz
            - Source of truth for real positions, account equity, and fills.

          ## 1. Deploy the service on Render

          1. Sign in to **Render**.
          2. Choose **New → Web Service**.
          3. Connect your own fork of:
             `https://github.com/Crypto-Forge-Labs/crypto-yall`
          4. Use:
             - Build command: `pip install -r requirements.txt`
             - Start command:
               `gunicorn cron_server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120`
          5. Add your environment variables under **Render → Environment**.
          6. Add a new secret named:
             `CRON_SECRET`
          7. Give `CRON_SECRET` a long random value that only you know.
             Do not paste it into an AI chat or public document.
          8. Deploy the service.
          9. Open:
             `https://YOUR-SERVICE.onrender.com/health`
          10. You should see a small JSON response showing the service is OK.

          ## 2. Environment variables on Render

          The executor scripts read their settings from environment variables.
          When Render runs the bot, the required values therefore need to exist
          in **Render**, not only in GitHub Secrets/Variables.

          ### Secret values

          - `HL_PRIVATE_KEY`
          - `HL_ACCOUNT_ADDRESS`
          - `GIST_TOKEN`
          - `GIST_ID`
          - `TRADING_GIST_ID`
          - `INTRADAY_GIST_ID`
          - `AGGRESSIVE_GIST_ID`
          - `GMAIL_USER`
          - `GMAIL_APP_PASSWORD`
          - `NOTIFY_EMAILS`
          - `TELEGRAM_BOT_TOKEN` (if used)
          - `TELEGRAM_CHAT_ID` (if used)
          - `CRON_SECRET`

          ### Normal configuration values

          Recommended testnet starting values:

          - `HL_TESTNET=true`
          - `SEGREGATED_CAPITAL=1000`
          - `INTRADAY_CAPITAL=500`
          - `AGGRESSIVE_CAPITAL=300`
          - `DAILY_DD_PCT=5`
          - `INTRADAY_DD_PCT=5`
          - `AGGRESSIVE_DD_PCT=3`
          - `MAX_POSITIONS=4`
          - `INTRADAY_MAX_POSITIONS=2`
          - `AGGRESSIVE_MAX_POSITIONS=4`
          - `KILL_SWITCH=ON`
          - `INTRADAY_KILL_SWITCH=ON`
          - `AGGRESSIVE_KILL_SWITCH=ON`

          Start on testnet.

          ## 3. Create the cron jobs on cron-job.org

          Sign in at:

          `https://cron-job.org`

          Each job should use:

          - Request method: **POST**
          - URL: your Render URL plus the endpoint below
          - Custom header:
            - Name: `X-Cron-Secret`
            - Value: exactly the same value as your Render `CRON_SECRET`

          Do not put the secret in the URL.

          ## 4. Schedules

          These schedules preserve the cadence used by the original repository,
          but the requests now come from cron-job.org instead of GitHub Actions.

          | Job | Render endpoint | Schedule |
          |---|---|---|
          | Daily | `/run/daily` | Every day at **00:15 UTC** |
          | Intraday | `/run/intraday` | Every hour at **:05 UTC** |
          | Aggressive | `/run/aggressive` | Every **30 minutes** |
          | Signal alerts | `/run/signals` | Every **6 hours** |

          Example, if Render gives you:

          `https://crypto-forge-scheduler.onrender.com`

          then the Daily URL is:

          `https://crypto-forge-scheduler.onrender.com/run/daily`

          and the Aggressive URL is:

          `https://crypto-forge-scheduler.onrender.com/run/aggressive`

          ## 5. Test one endpoint

          Before enabling all cron jobs:

          1. Keep the trading kill switches set to `OFF`.
          2. Run one cron job manually from cron-job.org.
          3. Open the Render logs.
          4. Confirm the request returned **202 Accepted**.
          5. Confirm the bot started in the Render logs.
          6. Confirm no secret values or full wallet address were printed.
          7. Only enable normal scheduling after the test is clean.

          ## 6. Important: avoid duplicate scheduling

          Do **not** leave automatic GitHub Action schedules enabled at the same
          time as cron-job.org.

          The Crypto Forge Labs cleanup removes those GitHub schedule triggers
          and leaves the workflows as **manual-only fallbacks**.

          ## 7. Checking whether it is alive

          Health check:

          `https://YOUR-SERVICE.onrender.com/health`

          Job status examples:

          `https://YOUR-SERVICE.onrender.com/status/daily`

          `https://YOUR-SERVICE.onrender.com/status/aggressive`

          The status endpoints also require the `X-Cron-Secret` header.

          ## Security

          - Never commit `CRON_SECRET` to GitHub.
          - Never commit Hyperliquid private keys.
          - Keep all credentials in Render's Environment settings.
          - Use a different `CRON_SECRET` if you think the old one was exposed.
          - Keep the three kill switches available as emergency controls.
          - Hyperliquid itself is the source of truth for open positions.

          ---

          *Crypto Forge Labs scheduler guide — August 2026*
          """
          write("docs/CRON_JOB_SETUP.md", textwrap_dedent(scheduler_guide))

          # ------------------------------------------------------------------
          # 13) README note near Quick Links / beginning
          # ------------------------------------------------------------------
          path = "README.md"
          t = read(path)
          scheduler_note = (
              "\n> **Scheduler:** Automated bot runs are hosted on Render and triggered "
              "by cron-job.org. See [`docs/CRON_JOB_SETUP.md`](docs/CRON_JOB_SETUP.md). "
              "GitHub Actions workflows are retained for manual fallback only.\n"
          )
          if "docs/CRON_JOB_SETUP.md" not in t:
              marker = "---\n"
              idx = t.find(marker)
              if idx >= 0:
                  insert_at = idx + len(marker)
                  t = t[:insert_at] + scheduler_note + t[insert_at:]
              else:
                  t = scheduler_note + "\n" + t
          write(path, t)

          # ------------------------------------------------------------------
          # 14) Broad public-branding cleanup for text/code files
          # ------------------------------------------------------------------
          for ext in ("*.py", "*.md"):
              for p in ROOT.rglob(ext):
                  if ".git" in p.parts:
                      continue
                  x = p.read_text(encoding="utf-8")
                  y = x.replace("Crypto Y'all", "Crypto Forge Labs")
                  y = y.replace("Crypto Yall", "Crypto Forge Labs")
                  if y != x:
                      p.write_text(y, encoding="utf-8")
                      print(f"Brand cleanup: {p}")

          # Remove old logo files only if app.py no longer references them.
          app_text = read("app.py")
          assets = [
              "assets/cryptoyall-main-3d-inverted-rgb-775px@72ppi.png",
              "assets/cryptoyall-main-3d-reverse-rgb-775px@72ppi.png",
              "assets/cryptoyall-main-3d-reverse-rgb-775px@72ppi (1).png",
          ]
          if "cryptoyall-main-3d-" not in app_text:
              for asset in assets:
                  p = ROOT / asset
                  if p.exists():
                      p.unlink()
                      print(f"Removed old branding asset: {asset}")

          # ------------------------------------------------------------------
          # 15) Sanity checks
          # ------------------------------------------------------------------
          forbidden = [
              "nocodepathways@gmail.com",
              "@Crypto_yall_bot",
              "crypto-yall-8s3evlspcczux5ztdmat9e.streamlit.app",
          ]

          text_files = []
          for pattern in ("*.py", "*.md", "*.yml", "*.yaml", "*.toml"):
              text_files.extend(ROOT.rglob(pattern))

          hits = []
          for p in text_files:
              if ".git" in p.parts:
                  continue
              try:
                  x = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for needle in forbidden:
                  if needle.lower() in x.lower():
                      hits.append(f"{p}: {needle}")

          if hits:
              print("WARNING: legacy public identifiers still found:")
              for hit in hits:
                  print(" -", hit)

          print("Crypto Forge Labs cleanup complete.")
          PY

      - name: Syntax check changed Python files
        run: |
          python -m py_compile \
            cron_server.py \
            test_trade.py \
            notifier.py \
            hyperliquid_executor.py \
            intraday_executor.py \
            aggressive_executor.py \
            app.py \
            trading_state.py

      - name: Show changed files
        run: git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Crypto Forge Labs Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Render cron scheduler and privacy cleanup"
            git push
          fi

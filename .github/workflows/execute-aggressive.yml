name: Execute Aggressive

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: execute-aggressive-live
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only Aggressive exit shadow suite
        run: python aggressive_exit_shadow_suite.py
        env:
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}

      - name: Execute aggressive trades on Hyperliquid
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Aggressive executor attempt ${attempt}/3"
            log_file="aggressive_attempt_${attempt}.log"

            python aggressive_profit_protection.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "Client init failed" "$log_file" && [ "$attempt" -lt 3 ]; then
              echo "Hyperliquid client init failed; retrying in 10 seconds..."
              sleep 10
              continue
            fi

            echo "Aggressive executor failed; not retrying this error."
            exit "$status"
          done

          exit 1
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          AGGRESSIVE_CAPITAL: ${{ vars.AGGRESSIVE_CAPITAL }}
          AGGRESSIVE_TEST_NOTIONAL: ${{ vars.AGGRESSIVE_TEST_NOTIONAL }}
          AGGRESSIVE_DD_PCT: ${{ vars.AGGRESSIVE_DD_PCT }}
          AGGRESSIVE_MAX_POSITIONS: ${{ vars.AGGRESSIVE_MAX_POSITIONS }}
          AGGRESSIVE_KILL_SWITCH: ${{ vars.AGGRESSIVE_KILL_SWITCH }}
          AGGRESSIVE_LEVERAGE: ${{ vars.AGGRESSIVE_LEVERAGE }}
          AGGRESSIVE_MAX_LEVERAGE: ${{ vars.AGGRESSIVE_MAX_LEVERAGE }}
          AGGRESSIVE_PROFIT_PROTECTION: 'ON'
          AGGRESSIVE_PROFIT_ARM_PCT: '0.5'
          AGGRESSIVE_PROFIT_GIVEBACK_PCT: '2.0'
          AGGRESSIVE_LOW_LEV_PROTECTION: ${{ vars.AGGRESSIVE_LOW_LEV_PROTECTION }}
          AGGRESSIVE_LOW_LEV_GIVEBACK: ${{ vars.AGGRESSIVE_LOW_LEV_GIVEBACK }}
          AGGRESSIVE_HIGH_LEV_PROTECTION: ${{ vars.AGGRESSIVE_HIGH_LEV_PROTECTION }}
          AGGRESSIVE_HIGH_LEV_GIVEBACK: ${{ vars.AGGRESSIVE_HIGH_LEV_GIVEBACK }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Publish daily bot report
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Report publish attempt ${attempt}/3"

            # Start from the current remote head so parallel bot runs cannot
            # silently overwrite each other's reports/latest.json commit.
            git fetch origin main
            git reset --hard origin/main

            python daily_bot_report.py
            git add reports/latest.json reports/$(date -u +%F).json

            if git diff --cached --quiet; then
              echo "No report changes to commit"
              exit 0
            fi

            git commit -m "Update bot report $(date -u +%F)"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Report push raced another workflow; retrying from latest main..."
            sleep 3
          done

          echo "Report publish failed after 3 attempts"
          exit 1
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}

      - name: Monitor Aggressive protection until next strategy run
        if: always()
        shell: bash
        run: |
          had_failure=0
          for cycle in 1 2 3 4 5; do
            echo "Waiting 5 minutes before Aggressive protection check ${cycle}/5"
            sleep 300
            ok=0
            for attempt in 1 2; do
              echo "Aggressive protection check ${cycle}/5, attempt ${attempt}/2"
              if python aggressive_profit_protection.py; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              had_failure=1
            fi
          done
          if [ "$had_failure" -ne 0 ]; then
            exit 1
          fi
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          AGGRESSIVE_CAPITAL: ${{ vars.AGGRESSIVE_CAPITAL }}
          AGGRESSIVE_TEST_NOTIONAL: ${{ vars.AGGRESSIVE_TEST_NOTIONAL }}
          AGGRESSIVE_DD_PCT: ${{ vars.AGGRESSIVE_DD_PCT }}
          AGGRESSIVE_MAX_POSITIONS: ${{ vars.AGGRESSIVE_MAX_POSITIONS }}
          AGGRESSIVE_KILL_SWITCH: ${{ vars.AGGRESSIVE_KILL_SWITCH }}
          AGGRESSIVE_LEVERAGE: ${{ vars.AGGRESSIVE_LEVERAGE }}
          AGGRESSIVE_MAX_LEVERAGE: ${{ vars.AGGRESSIVE_MAX_LEVERAGE }}
          AGGRESSIVE_PROFIT_PROTECTION: 'ON'
          AGGRESSIVE_PROTECTION_ONLY: 'ON'
          AGGRESSIVE_PROFIT_ARM_PCT: '0.5'
          AGGRESSIVE_PROFIT_GIVEBACK_PCT: '2.0'
          AGGRESSIVE_LOW_LEV_PROTECTION: ${{ vars.AGGRESSIVE_LOW_LEV_PROTECTION }}
          AGGRESSIVE_LOW_LEV_GIVEBACK: ${{ vars.AGGRESSIVE_LOW_LEV_GIVEBACK }}
          AGGRESSIVE_HIGH_LEV_PROTECTION: ${{ vars.AGGRESSIVE_HIGH_LEV_PROTECTION }}
          AGGRESSIVE_HIGH_LEV_GIVEBACK: ${{ vars.AGGRESSIVE_HIGH_LEV_GIVEBACK }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

name: Execute Aggressive

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: execute-aggressive-live
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only Aggressive exit shadow suite
        continue-on-error: true
        run: python aggressive_exit_shadow_suite.py
        env:
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}

      - name: Execute aggressive trades on Hyperliquid
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Aggressive executor attempt ${attempt}/3"
            log_file="aggressive_attempt_${attempt}.log"

            python aggressive_profit_protection.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "Client init failed" "$log_file" && [ "$attempt" -lt 3 ]; then
              echo "Hyperliquid client init failed; retrying in 10 seconds..."
              sleep 10
              continue
            fi

            echo "Aggressive executor failed; not retrying this error."
            exit "$status"
          done

          exit 1
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          AGGRESSIVE_CAPITAL: ${{ vars.AGGRESSIVE_CAPITAL }}
          AGGRESSIVE_TEST_NOTIONAL: ${{ vars.AGGRESSIVE_TEST_NOTIONAL }}
          AGGRESSIVE_DD_PCT: ${{ vars.AGGRESSIVE_DD_PCT }}
          AGGRESSIVE_MAX_POSITIONS: ${{ vars.AGGRESSIVE_MAX_POSITIONS }}
          AGGRESSIVE_KILL_SWITCH: ${{ vars.AGGRESSIVE_KILL_SWITCH }}
          AGGRESSIVE_PROFIT_PROTECTION: 'ON'
          AGGRESSIVE_PROFIT_ARM_PCT: '0.5'
          AGGRESSIVE_PROFIT_GIVEBACK_PCT: '2.0'
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGGRESSIVE_GIST_ID: ${{ secrets.AGGRESSIVE_GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

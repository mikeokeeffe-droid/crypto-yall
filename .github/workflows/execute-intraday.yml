name: Execute Intraday

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: execute-intraday-live
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only Intraday exit shadow monitor
        continue-on-error: true
        run: python intraday_shadow_report.py
        env:
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Execute intraday trades on Hyperliquid
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Intraday executor attempt ${attempt}/3"
            log_file="intraday_attempt_${attempt}.log"

            python intraday_executor.py 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "Client init failed" "$log_file" && [ "$attempt" -lt 3 ]; then
              echo "Hyperliquid client init failed; retrying in 10 seconds..."
              sleep 10
              continue
            fi

            echo "Intraday executor failed; not retrying this error."
            exit "$status"
          done

          exit 1
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ vars.HL_TESTNET }}
          INTRADAY_CAPITAL: ${{ vars.INTRADAY_CAPITAL }}
          INTRADAY_DD_PCT: ${{ vars.INTRADAY_DD_PCT }}
          INTRADAY_MAX_POSITIONS: ${{ vars.INTRADAY_MAX_POSITIONS }}
          INTRADAY_KILL_SWITCH: ${{ vars.INTRADAY_KILL_SWITCH }}
          INTRADAY_TEST_NOTIONAL: ${{ vars.INTRADAY_TEST_NOTIONAL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          INTRADAY_GIST_ID: ${{ secrets.INTRADAY_GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

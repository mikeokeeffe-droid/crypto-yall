name: ATR EMA MACD VWAP Exit Research

on:
  push:
    branches:
      - rsi-exit-test
    paths:
      - exit_signal_family_backtest.py
      - .github/workflows/exit-family-screen.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exit-family-screen-research
  cancel-in-progress: true

jobs:
  screen:
    name: ATR EMA MACD VWAP screen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
        with:
          ref: rsi-exit-test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run four-family exit screen
        run: |
          python exit_signal_family_backtest.py | tee exit_signal_family_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-signal-family-results
          path: exit_signal_family_results.txt
          if-no-files-found: error

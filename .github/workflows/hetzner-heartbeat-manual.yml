name: Hetzner SSH heartbeat (manual, no trading)

# REVIEW ONLY. No automatic triggers. GitHub workflow_dispatch requires
# a workflow present on the default branch; this draft file cannot run
# from PR #42. Do not merge/deploy solely to activate the heartbeat.
on:
  workflow_dispatch:
    inputs:
      confirm_heartbeat_only:
        description: 'Type yes for one heartbeat-only SSH request (no trade)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  heartbeat-only:
    if: github.ref == 'refs/heads/main' && inputs.confirm_heartbeat_only == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out pinned repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded heartbeat (no trading)
        env:
          HETZNER_HEARTBEAT_SSH_KEY: ${{ secrets.HETZNER_HEARTBEAT_SSH_KEY }}
          HETZNER_HEARTBEAT_HOST_KEY_ED25519: ${{ secrets.HETZNER_HEARTBEAT_HOST_KEY_ED25519 }}
          HEARTBEAT_MANUAL_CONFIRM: ${{ inputs.confirm_heartbeat_only }}
        run: |
          python3 -B -m sender_review.ssh_heartbeat_client_manual

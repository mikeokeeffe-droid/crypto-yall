name: Hyperliquid Testnet Public Read-Only Check

on:
  pull_request:
    paths:
      - 'hyperliquid_public_testnet_smoke.py'
      - 'tests/test_hyperliquid_public_testnet_smoke.py'
      - '.github/workflows/hyperliquid-testnet-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet-public-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline contract tests
        run: python -m unittest discover -s tests -p 'test_hyperliquid_public_testnet_smoke.py' -v
      - name: Query public testnet metadata (no wallet, no trading)
        run: python hyperliquid_public_testnet_smoke.py

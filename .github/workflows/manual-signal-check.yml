      - name: Show actual bot signals
        run: |
          python - <<'PY'
          from hyperliquid_executor import compute_all_signals as compute_daily
          from aggressive_executor import compute_aggressive_signals
          from intraday_executor import compute_intraday_signals

          daily = compute_daily()
          aggressive = compute_aggressive_signals()
          intraday = compute_intraday_signals()


name: Manual Signal Check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show all bot signals and Hyperliquid positions
        env:
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_TESTNET: ${{ secrets.HL_TESTNET }}
        run: |
          python - <<'PY'
          from hyperliquid_executor import (
              compute_all_signals as compute_daily,
              get_client,
              get_open_positions,
          )
          from aggressive_executor import compute_aggressive_signals
          from intraday_executor import compute_intraday_signals

          daily = compute_daily()
          aggressive = compute_aggressive_signals()
          intraday = compute_intraday_signals()

          print("\n===== DAILY BOT SIGNALS =====\n")

          for ticker, data in sorted(daily.items()):
              print(
                  f"{ticker} | DAILY | "
                  f"signal={data.get('signal')} | "
                  f"action={data.get('action')} | "
                  f"regime={data.get('regime')} | "
                  f"price=${data.get('price', 0):.2f}"
              )

          print("\n===== AGGRESSIVE BOT SIGNALS — 30m =====\n")

          for ticker, data in sorted(aggressive.items()):
              print(
                  f"{ticker} | AGGRESSIVE 30m | "
                  f"signal={data.get('signal')} | "
                  f"action={data.get('action')} | "
                  f"price=${data.get('price', 0):.2f} | "
                  f"osc={data.get('osc', 0):.4f}"
              )

          print("\n===== INTRADAY BOT SIGNALS — 1h =====\n")

          for ticker, data in sorted(intraday.items()):
              print(
                  f"{ticker} | INTRADAY 1h | "
                  f"signal={data.get('signal')} | "
                  f"action={data.get('action')} | "
                  f"price=${data.get('price', 0):.2f} | "
                  f"osc={data.get('osc', 0):.4f}"
              )

          print("\n===== HYPERLIQUID OPEN POSITIONS =====\n")

          try:
              info, exchange, address = get_client()
              positions = get_open_positions(info, address)

              if not positions:
                  print("No open positions")
              else:
                  for coin, pos in sorted(positions.items()):
                      side = "LONG" if pos["size"] > 0 else "SHORT"

                      print(
                          f"{coin} | {side} | "
                          f"size={abs(pos['size'])} | "
                          f"entry=${pos['entry_px']:.4f} | "
                          f"uPnL=${pos['unrealized_pnl']:.2f}"
                      )

          except Exception as e:
              print(f"Could not load Hyperliquid positions: {e}")

          PY

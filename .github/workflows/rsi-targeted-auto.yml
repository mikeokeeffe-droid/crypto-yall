name: RSI Targeted Research (Auto)

on:
  push:
    branches:
      - rsi-exit-test
    paths:
      - rsi_targeted_backtest.py
      - btc_rsi_asymmetric_backtest.py
      - adx_rsi_flat_exit_backtest.py
      - dmi_adx_flat_exit_backtest.py
      - exit_signal_family_backtest.py
      - .github/workflows/rsi-targeted-auto.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsi-targeted-research
  cancel-in-progress: true

jobs:
  backtest:
    name: Exit signal research
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
        with:
          ref: rsi-exit-test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted rolling RSI research
        run: |
          python rsi_targeted_backtest.py | tee rsi_targeted_results.txt

      - name: Run BTC asymmetric RSI research
        run: |
          python btc_rsi_asymmetric_backtest.py | tee btc_rsi_asymmetric_results.txt

      - name: Run ADX FLAT-exit research
        run: |
          python adx_rsi_flat_exit_backtest.py | tee adx_rsi_flat_exit_results.txt

      - name: Run DMI plus ADX FLAT-exit research
        run: |
          python dmi_adx_flat_exit_backtest.py | tee dmi_adx_flat_exit_results.txt

      - name: Run ATR EMA MACD VWAP family research
        run: |
          python exit_signal_family_backtest.py | tee exit_signal_family_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-signal-research-results
          path: |
            rsi_targeted_results.txt
            btc_rsi_asymmetric_results.txt
            adx_rsi_flat_exit_results.txt
            dmi_adx_flat_exit_results.txt
            exit_signal_family_results.txt
          if-no-files-found: warn

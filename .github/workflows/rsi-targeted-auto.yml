name: RSI Targeted Research (Auto)

on:
  push:
    branches:
      - rsi-exit-test
    paths:
      - rsi_targeted_backtest.py
      - btc_rsi_asymmetric_backtest.py
      - .github/workflows/rsi-targeted-auto.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsi-targeted-research
  cancel-in-progress: true

jobs:
  backtest:
    name: Rolling RSI research — fixed dataset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
        with:
          ref: rsi-exit-test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted rolling RSI research
        run: |
          python rsi_targeted_backtest.py | tee rsi_targeted_results.txt

      - name: Run BTC asymmetric RSI research
        run: |
          python btc_rsi_asymmetric_backtest.py | tee btc_rsi_asymmetric_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-targeted-fixed-data
          path: |
            rsi_targeted_results.txt
            btc_rsi_asymmetric_results.txt
          if-no-files-found: warn

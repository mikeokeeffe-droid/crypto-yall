name: Test Atomic Entry Reservations (Isolated PostgreSQL)
on:
  pull_request:
    paths:
      - 'db/entry_reservations_staging.sql'
      - 'db/entry_reservations_staging_grants.sql'
      - 'db/position_ownership_staging.sql'
      - 'tests/**'
      - 'entry_gate_staging.py'
      - 'order_reconciliation_staging.py'
      - 'supabase_entry_store_staging.py'
      - 'entry_lifecycle_staging.py'
      - 'executor_entry_dry_run_staging.py'
      - 'shared_entry_gate_staging.py'
      - 'ownership_handoff_staging.py'
      - '.github/workflows/test-atomic-entry-reservations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: safety_test
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Create Supabase-compatible roles in disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN;'
      - name: Apply staging schema and smoke test
        run: |
          psql -v ON_ERROR_STOP=1 -f db/entry_reservations_staging.sql
          psql -v ON_ERROR_STOP=1 -f db/entry_reservations_staging_grants.sql
          psql -v ON_ERROR_STOP=1 -f db/position_ownership_staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/position_ownership_staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/entry_reservation_permissions.sql
          psql -v ON_ERROR_STOP=1 -f tests/entry_reservations_staging.sql
      - name: Test offline re-entry lock safeguards
        run: python -m unittest discover -s tests -p 'test_reentry_safety.py' -v
      - name: Test fail-closed entry adapter
        run: python -m unittest discover -s tests -p 'test_entry_gate_staging.py' -v
      - name: Test simulated order outcome reconciliation
        run: python -m unittest discover -s tests -p 'test_order_reconciliation_staging.py' -v
      - name: Test staging Supabase RPC adapter (mock only)
        run: python -m unittest discover -s tests -p 'test_supabase_entry_store_staging.py' -v
      - name: Test simulated order lifecycle
        run: python -m unittest discover -s tests -p 'test_entry_lifecycle_staging.py' -v
      - name: Test non-trading executor dry run
        run: python -m unittest discover -s tests -p 'test_executor_entry_dry_run_staging.py' -v
      - name: Verify three real executor order paths (static)
        run: python -m unittest discover -s tests -p 'test_executor_paths_staging.py' -v
      - name: Test shared three-bot entry inspection wrapper
        run: python -m unittest discover -s tests -p 'test_shared_entry_gate_staging.py' -v
      - name: Test simulated entry failures and cross-bot conflicts
        run: python -m unittest discover -s tests -p 'test_shared_entry_failure_staging.py' -v
      - name: Test offline ownership handoff and release safeguards
        run: python -m unittest discover -s tests -p 'test_ownership_handoff_staging.py' -v
      - name: Test competing transactions and failure cases
        run: python -m unittest discover -s tests -p 'test_entry_reservation_postgres.py' -v

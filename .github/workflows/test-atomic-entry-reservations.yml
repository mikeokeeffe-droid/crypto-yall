name: Test Atomic Entry Reservations (Isolated PostgreSQL)
on:
  push:
    branches:
      - safety/atomic-entry-reservations-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: safety_test
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Apply staging schema and smoke test
        run: |
          psql -v ON_ERROR_STOP=1 -f db/entry_reservations_staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/entry_reservations_staging.sql
      - name: Test offline re-entry lock safeguards
        run: python -m unittest discover -s tests -p 'test_reentry_safety.py' -v
      - name: Test competing transactions and failure cases
        run: python -m unittest discover -s tests -p 'test_entry_reservation_postgres.py' -v

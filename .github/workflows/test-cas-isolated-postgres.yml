name: Test Supabase CAS in Isolated PostgreSQL

on:
  pull_request:
    paths:
      - 'db/atomic_state_update.sql'
      - 'tests/ci_cas_bot_state.sql'
      - '.github/workflows/test-cas-isolated-postgres.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: isolated_cas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: isolated_cas_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/atomic_state_update.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/ci_cas_bot_state.sql

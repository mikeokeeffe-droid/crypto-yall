name: Distinct UID journal isolation (offline branch test)

on:
  push:
    branches:
      - safety/original-bots-offline-baseline-20261030
    paths:
      - '.github/workflows/test-distinct-uid-journal-isolation-manual.yml'
      - 'tests/test_offline_distinct_uid_journal_isolation.py'
      - 'offline_sender_restart_journal.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  distinct-uid-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise disposable journal as separate Linux UID (no skips)
        run: |
          set -euo pipefail
          # Fail explicitly if the environment cannot execute this test.
          sudo -n env PATH="$PATH" PYTHONPATH="$PWD" \
            python -m unittest discover -s tests \
              -p 'test_offline_distinct_uid_journal_isolation.py' -v \
              2>&1 | tee /tmp/distinct-uid-isolation.log
          grep -q 'Ran 1 test' /tmp/distinct-uid-isolation.log
          grep -q '^OK$' /tmp/distinct-uid-isolation.log
          if grep -Eq 'skipped|SKIP' /tmp/distinct-uid-isolation.log; then
            echo 'Distinct UID test was skipped: isolation is NOT verified'
            exit 1
          fi

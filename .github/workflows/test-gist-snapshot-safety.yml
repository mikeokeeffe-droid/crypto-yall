name: Test Gist Snapshot Safety

on:
  pull_request:
    paths:
      - 'scripts/backup_gists_to_supabase.py'
      - 'tests/test_gist_snapshot_safety.py'
      - '.github/workflows/test-gist-snapshot-safety.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_gist_snapshot_safety.py' -v

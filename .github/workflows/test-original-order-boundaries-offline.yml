name: Original bot order boundary tests (offline only)

on:
  pull_request:
    paths:
      - 'tests/test_original_order_boundaries_offline.py'
      - 'tests/test_position_increase_claim_invariant_offline.py'
      - 'entry_claim_safety.py'
      - 'entry_reconciliation_review_offline.py'
      - 'offline_independent_entry_reconciler.py'
      - 'offline_exchange_page_review.py'
      - 'tests/test_offline_exchange_page_review.py'
      - 'offline_paginated_exchange_evidence.py'
      - 'tests/test_offline_paginated_exchange_evidence.py'
      - 'tests/test_offline_filled_paginated_recovery.py'
      - 'offline_hyperliquid_wire_review.py'
      - 'tests/test_offline_hyperliquid_wire_review.py'
      - 'offline_hyperliquid_fill_window_audit.py'
      - 'tests/test_offline_hyperliquid_fill_window_audit.py'
      - 'offline_hyperliquid_retention_gate.py'
      - 'tests/test_offline_hyperliquid_retention_gate.py'
      - 'offline_hyperliquid_readonly_boundary.py'
      - 'tests/test_offline_hyperliquid_readonly_boundary.py'
      - 'offline_hyperliquid_transport_plan.py'
      - 'tests/test_offline_hyperliquid_transport_plan.py'
      - 'offline_filled_ownership_review.py'
      - 'tests/test_offline_filled_ownership_review.py'
      - 'offline_filled_recovery_inspection.py'
      - 'tests/test_offline_filled_recovery_inspection.py'
      - 'tests/test_offline_independent_entry_reconciler.py'
      - 'tests/test_entry_reconciliation_review_offline.py'
      - 'tests/test_persisted_intent_reconciliation_offline.py'
      - 'shared_entry_admission.py'
      - 'tests/test_shared_entry_admission_offline.py'
      - 'aggressive_executor.py'
      - 'intraday_executor.py'
      - 'hyperliquid_executor.py'
      - '.github/workflows/test-original-order-boundaries-offline.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise fake exchanges only (no secrets, no clients, no orders)
        run: |
          python -m unittest discover -s tests -p 'test_original_order_boundaries_offline.py' -v
          python -m unittest discover -s tests -p 'test_position_increase_claim_invariant_offline.py' -v
          python -m unittest discover -s tests -p 'test_shared_entry_admission_offline.py' -v
          python -m unittest discover -s tests -p 'test_entry_reconciliation_review_offline.py' -v
          python -m unittest discover -s tests -p 'test_persisted_intent_reconciliation_offline.py' -v
          python -m unittest discover -s tests -p 'test_offline_independent_entry_reconciler.py' -v
          python -m unittest discover -s tests -p 'test_offline_filled_ownership_review.py' -v
          python -m unittest discover -s tests -p 'test_offline_filled_recovery_inspection.py' -v
          python -m unittest discover -s tests -p 'test_offline_exchange_page_review.py' -v
          python -m unittest discover -s tests -p 'test_offline_paginated_exchange_evidence.py' -v
          python -m unittest discover -s tests -p 'test_offline_filled_paginated_recovery.py' -v
          python -m unittest discover -s tests -p 'test_offline_hyperliquid_wire_review.py' -v
          python -m unittest discover -s tests -p 'test_offline_hyperliquid_fill_window_audit.py' -v
          python -m unittest discover -s tests -p 'test_offline_hyperliquid_retention_gate.py' -v
          python -m unittest discover -s tests -p 'test_offline_hyperliquid_readonly_boundary.py' -v
          python -m unittest discover -s tests -p 'test_offline_hyperliquid_transport_plan.py' -v

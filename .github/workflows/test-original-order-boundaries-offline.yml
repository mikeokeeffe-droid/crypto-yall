permissions:
  contents: read

jobs:
  offline-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline collector evidence isolated from three real bot UIDs
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" PYTHONPATH="$PWD" \
            python -m unittest discover -s tests \
              -p 'test_offline_collector_distinct_uid_ci.py' -v \
              2>&1 | tee /tmp/offline-collector-uids.log
          grep -q 'Ran 1 test' /tmp/offline-collector-uids.log
          grep -q '^OK$' /tmp/offline-collector-uids.log
          if grep -Eq 'skipped|SKIP' /tmp/offline-collector-uids.log; then
            echo 'Collector UID isolation was skipped: fail closed'
            exit 1
          fi
      - name: Verify distinct-UID group-gated offline socket and private journal
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" PYTHONPATH="$PWD" \
            python -m unittest discover -s tests \
              -p 'test_offline_group_gated_socket_access_ci.py' -v \
              2>&1 | tee /tmp/offline-group-gated-socket.log
          grep -q 'Ran 1 test' /tmp/offline-group-gated-socket.log
          grep -q '^OK$' /tmp/offline-group-gated-socket.log
          if grep -Eq 'skipped|SKIP' /tmp/offline-group-gated-socket.log; then
            echo 'Group-gated socket UID isolation was skipped: fail closed'
            exit 1
          fi
      - name: Exercise fake exchanges only (no secrets, no clients, no orders)
        run: |
          python -m unittest discover -s tests -p 'test_offline_atomic_socket_bridge_fixture.py' -v
          python -m unittest discover -s tests -p 'test_offline_original_bot_intent_adapter.py' -v

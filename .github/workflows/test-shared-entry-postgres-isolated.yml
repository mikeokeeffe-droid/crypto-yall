name: Shared entry real PostgreSQL tests (disposable only)
on:
  pull_request:
    paths:
      - 'db/entry_reservations_staging.sql'
      - 'tests/test_shared_entry_postgres_isolated.py'
      - 'tests/test_restricted_entry_logins_ci.py'
      - 'tests/test_uncertain_order_lifecycle_ci.py'
      - 'tests/test_reconciliation_permission_boundary_ci.py'
      - 'tests/test_stale_handoff_cas_ci.py'
      - 'db/restricted_entry_logins_ci_only.sql'
      - 'tests/test_readonly_reconciler_login_ci.py'
      - 'restricted_shared_entry_postgres_ci.py'
      - '.github/workflows/test-shared-entry-postgres-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-shared-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: safety_test
      ISOLATED_POSTGRES_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test PostgreSQL client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Create Supabase-compatible roles only in disposable CI DB
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN;'
      - name: Apply staging-only SQL to disposable safety_test database
        run: psql -v ON_ERROR_STOP=1 -f db/entry_reservations_staging.sql
      - name: Create disposable restricted bot identities
        run: psql -v ON_ERROR_STOP=1 -f db/restricted_entry_logins_ci_only.sql
      - name: Test real concurrent claims and fresh-process restart
        run: |
          python -m unittest discover -s tests -p 'test_shared_entry_postgres_isolated.py' -v
          python -m unittest discover -s tests -p 'test_restricted_entry_logins_ci.py' -v
          python -m unittest discover -s tests -p 'test_uncertain_order_lifecycle_ci.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_permission_boundary_ci.py' -v
          python -m unittest discover -s tests -p 'test_stale_handoff_cas_ci.py' -v
          python -m unittest discover -s tests -p 'test_readonly_reconciler_login_ci.py' -v

name: Shared entry real PostgreSQL tests (disposable only)
on:
  pull_request:
    paths:
      - 'db/entry_reservations_staging.sql'
      - 'tests/test_shared_entry_postgres_isolated.py'
      - 'tests/test_restricted_entry_logins_ci.py'
      - 'tests/test_uncertain_order_lifecycle_ci.py'
      - 'tests/test_reconciliation_permission_boundary_ci.py'
      - 'tests/test_stale_handoff_cas_ci.py'
      - 'db/restricted_entry_logins_ci_only.sql'
      - 'db/restricted_entry_proof_ci_only.sql'
      - 'db/account_scoped_claims_ci_only.sql'
      - 'db/pre_submit_intent_ci_only.sql'
      - 'db/ci_sender_journal_review_only.sql'
      - 'tests/test_pre_submit_intent_postgres_ci.py'
      - 'tests/test_ci_sender_journal_postgres.py'
      - 'offline_ci_pg_fake_sender.py'
      - 'tests/test_offline_ci_pg_fake_sender.py'
      - 'tests/test_ci_pg_fake_sender_process_crashes.py'
      - 'offline_ci_pg_sender_reconciliation.py'
      - 'tests/test_offline_ci_pg_sender_reconciliation.py'
      - 'offline_original_bot_to_ci_sender.py'
      - 'tests/test_offline_three_bot_sender_reconciliation_ci.py'
      - 'tests/test_offline_three_bot_pg_process_e2e.py'
      - 'offline_original_bot_intent_adapter.py'
      - 'offline_original_bot_postgres_bridge_ci.py'
      - 'tests/test_offline_original_bot_postgres_bridge_ci.py'
      - 'offline_original_bot_socket_bridge_ci.py'
      - 'tests/test_offline_original_bot_socket_bridge_ci.py'
      - 'offline_original_bot_process_listener_ci.py'
      - 'tests/test_offline_original_bot_process_listener_ci.py'
      - 'tests/test_offline_original_bot_distinct_uid_postgres_ci.py'
      - 'tests/test_account_scoped_claims_postgres_ci.py'
      - 'tests/test_readonly_reconciler_login_ci.py'
      - 'restricted_shared_entry_postgres_ci.py'
      - '.github/workflows/test-shared-entry-postgres-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-shared-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: safety_test
      ISOLATED_POSTGRES_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test PostgreSQL client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Create Supabase-compatible roles only in disposable CI DB
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN;'
      - name: Apply staging-only SQL to disposable safety_test database
        run: psql -v ON_ERROR_STOP=1 -f db/entry_reservations_staging.sql
      - name: Create disposable restricted bot identities
        run: psql -v ON_ERROR_STOP=1 -f db/restricted_entry_logins_ci_only.sql
      - name: Apply isolated bot-scoped claim proof restrictions
        run: psql -v ON_ERROR_STOP=1 -f db/restricted_entry_proof_ci_only.sql
      - name: Create isolated account-scoped claim model
        run: psql -v ON_ERROR_STOP=1 -f db/account_scoped_claims_ci_only.sql
      - name: Create disposable atomic pre-submit intent model
        run: psql -v ON_ERROR_STOP=1 -f db/pre_submit_intent_ci_only.sql
      - name: Create review-only sender roles and durable fake dispatch schema
        run: psql -v ON_ERROR_STOP=1 -f db/ci_sender_journal_review_only.sql
      - name: Test real concurrent claims and fresh-process restart
        run: |
          python -m unittest discover -s tests -p 'test_shared_entry_postgres_isolated.py' -v
          python -m unittest discover -s tests -p 'test_restricted_entry_logins_ci.py' -v
          python -m unittest discover -s tests -p 'test_account_scoped_claims_postgres_ci.py' -v
          python -m unittest discover -s tests -p 'test_pre_submit_intent_postgres_ci.py' -v
          python -m unittest discover -s tests -p 'test_ci_sender_journal_postgres.py' -v
          python -m unittest discover -s tests -p 'test_offline_ci_pg_fake_sender.py' -v
          python -m unittest discover -s tests -p 'test_ci_pg_fake_sender_process_crashes.py' -v
          python -m unittest discover -s tests -p 'test_offline_ci_pg_sender_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_offline_three_bot_sender_reconciliation_ci.py' -v
          python -m unittest discover -s tests -p 'test_offline_three_bot_pg_process_e2e.py' -v
          python -m unittest discover -s tests -p 'test_offline_original_bot_postgres_bridge_ci.py' -v
          python -m unittest discover -s tests -p 'test_offline_original_bot_socket_bridge_ci.py' -v
          python -m unittest discover -s tests -p 'test_offline_original_bot_process_listener_ci.py' -v
          python -m unittest discover -s tests -p 'test_uncertain_order_lifecycle_ci.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_permission_boundary_ci.py' -v
          python -m unittest discover -s tests -p 'test_stale_handoff_cas_ci.py' -v
          python -m unittest discover -s tests -p 'test_readonly_reconciler_login_ci.py' -v
      - name: Verify three distinct Linux UIDs on disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" PYTHONPATH="$PWD" \
            ISOLATED_POSTGRES_CI=1 PGDATABASE=safety_test PGHOST=localhost \
            PGPASSWORD="$PGPASSWORD" \
            python -m unittest discover -s tests \
              -p 'test_offline_original_bot_distinct_uid_postgres_ci.py' -v \
              2>&1 | tee /tmp/three-real-uid-pg.log
          grep -q 'Ran 1 test' /tmp/three-real-uid-pg.log
          grep -q '^OK$' /tmp/three-real-uid-pg.log
          if grep -Eq 'skipped|SKIP' /tmp/three-real-uid-pg.log; then
            echo 'Distinct-UID test was skipped — fail closed'
            exit 1
          fi

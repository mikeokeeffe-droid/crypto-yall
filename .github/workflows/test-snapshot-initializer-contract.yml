name: Test Snapshot Initializer Contract

on:
  pull_request:
    paths:
      - 'db/initialize_bot_states_from_snapshots.sql'
      - 'tests/test_snapshot_initializer_contract.py'
      - '.github/workflows/test-snapshot-initializer-contract.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_snapshot_initializer_contract.py' -v

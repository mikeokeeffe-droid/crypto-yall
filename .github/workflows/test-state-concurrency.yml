name: Test State Concurrency Contract

on:
  pull_request:
    paths:
      - 'tests/test_state_concurrency_contract.py'
      - '.github/workflows/test-state-concurrency.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-state-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline concurrency tests
        run: python -m unittest discover -s tests -p test_state_concurrency_contract.py -v

name: Test Supabase State Adapter Offline

on:
  pull_request:
    paths:
      - 'supabase_state_store.py'
      - 'tests/test_supabase_state_store.py'
      - 'aggressive_executor.py'
      - 'intraday_executor.py'
      - 'hyperliquid_executor.py'
      - '.github/workflows/test-supabase-state-adapter.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -p test_supabase_state_store.py -v
          python -m unittest test_intraday_protection_only_offline -v

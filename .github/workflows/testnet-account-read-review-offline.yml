name: Testnet account read-only review (offline)

# Static mocked tests only. No secrets, HTTP calls, server changes or deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - 'readonly_connection_review/**'
      - '.github/workflows/testnet-account-read-review-offline.yml'

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline mock-only Testnet reader tests
        run: python3 -B -m unittest readonly_connection_review.test_testnet_account_read_review_only -v
      - name: Check one-shot TLS, network-failure and no-trading behavior offline
        run: python3 -B -m unittest readonly_connection_review.test_on_run_connection_review -v
      - name: Reject unsafe Testnet egress-policy changes using synthetic offline requests
        run: python3 -B -m unittest readonly_connection_review.test_testnet_egress_policy_review_offline -v
      - name: Verify offline gateway lease and request state machine
        run: python3 -B -m unittest readonly_connection_review.test_offline_gateway_step_gate -v
      - name: Verify synthetic Unix peer-admission denial rules offline
        run: python3 -B -m unittest readonly_connection_review.test_offline_gateway_peer_admission -v
      - name: Verify Linux kernel Unix peer credentials with local socketpairs only
        run: python3 -B -m unittest readonly_connection_review.test_kernel_unix_peer_review_offline -v
      - name: Verify offline Linux process provenance and PID-reuse failure checks
        run: python3 -B -m unittest readonly_connection_review.test_linux_process_provenance_review_offline -v
      - name: Verify offline integration of kernel peer and two fixed Testnet frames
        run: python3 -B -m unittest readonly_connection_review.test_offline_gateway_integration_review -v
      - name: Verify local Unix socket protocol with mock-only replies
        run: python3 -B -m unittest readonly_connection_review.test_unix_gateway_protocol_review_offline -v

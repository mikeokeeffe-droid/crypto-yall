name: Testnet paper trading preflight (offline hold only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'testnet_paper_review/**'
      - '.github/workflows/testnet-paper-preflight-offline.yml'
      - '.github/workflows/hyperliquid-testnet-public-account-status.yml'

permissions:
  contents: read

jobs:
  deny-by-default:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review paper-trade readiness without any keys or network
        run: python3 -B -m unittest testnet_paper_review.test_offline_paper_preflight testnet_paper_review.test_offline_order_guard testnet_paper_review.test_offline_durable_restart_journal testnet_paper_review.test_testnet_daily_admission_gate testnet_paper_review.test_testnet_daily_readonly_preflight testnet_paper_review.test_offline_daily_bracket_plan testnet_paper_review.test_offline_bracket_reconciliation testnet_paper_review.test_offline_bracket_lifecycle testnet_paper_review.test_offline_signer_boundary testnet_paper_review.test_daily_testnet_signal_adapter testnet_paper_review.test_manual_testnet_status_workflow testnet_paper_review.test_testnet_public_sol_market testnet_paper_review.test_testnet_daily_public_pipeline testnet_paper_review.test_offline_client_order_bundle testnet_paper_review.test_testnet_spot_funds_probe testnet_paper_review.test_single_host_live_journal testnet_paper_review.test_isolated_testnet_sender testnet_paper_review.test_testnet_public_agent_review testnet_paper_review.test_testnet_post_ack_public_reconciliation testnet_paper_review.test_testnet_emergency_close_review testnet_paper_review.test_testnet_server_deployment_check testnet_paper_review.test_testnet_local_host_inventory testnet_paper_review.test_testnet_one_shot_operator_preview testnet_paper_review.test_emergency_close_one_shot_journal testnet_paper_review.test_testnet_trial_release_checkpoint testnet_paper_review.test_read_only_original_daily_sol_signal testnet_paper_review.test_one_shot_protection_evidence testnet_paper_review.test_testnet_restart_public_recovery testnet_paper_review.test_testnet_readonly_emergency_watch -v

  sdk-wire-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install pinned Hyperliquid encoding SDK (no keys)
        run: python -m pip install hyperliquid-python-sdk==0.24.0
      - name: Validate official SDK order serialization without exchange calls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest testnet_paper_review.test_testnet_sdk_wire_adapter testnet_paper_review.test_fake_testnet_sender_execution testnet_paper_review.test_testnet_sdk_server_client_preflight testnet_paper_review.test_isolated_testnet_emergency_sender -v

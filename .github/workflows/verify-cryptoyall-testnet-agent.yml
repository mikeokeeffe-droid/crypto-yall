name: Verify Crypto Yall Testnet Agent (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: crypto-yall-testnet
    steps:
      - name: Install minimal address derivation dependency
        run: python -m pip install --disable-pip-version-check 'eth-account==0.13.7'

      - name: Verify key address and Testnet agent association without trading
        shell: bash
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.HL_TESTNET_PRIVATE_KEY }}
          EXPECTED_AGENT: ${{ vars.HL_TESTNET_AGENT_ADDRESS }}
          EXPECTED_ACCOUNT: ${{ vars.HL_TESTNET_ACCOUNT_ADDRESS }}
          TESTNET_ONLY: ${{ vars.HL_TESTNET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from eth_account import Account

          def fail(message):
              print("FAIL:", message)
              sys.exit(1)

          if os.getenv("TESTNET_ONLY", "").strip().lower() != "true":
              fail("Testnet flag is not explicitly true")
          key = os.getenv("AGENT_PRIVATE_KEY", "").strip()
          agent = os.getenv("EXPECTED_AGENT", "").strip()
          account = os.getenv("EXPECTED_ACCOUNT", "").strip()
          if not key or not agent or not account:
              fail("A required Testnet secret or address is missing")
          if not (agent.startswith("0x") and len(agent) == 42 and
                  account.startswith("0x") and len(account) == 42):
              fail("Expected addresses have invalid formatting")
          try:
              derived = Account.from_key(key).address
          except Exception:
              fail("Testnet signing key is invalid")
          if derived.lower() != agent.lower():
              fail("Secret-derived address does not match the expected Testnet agent")
          print("PASS: Secret corresponds to the expected Testnet agent address")

          body = json.dumps({"type": "userRole", "user": agent}).encode()
          request = urllib.request.Request(
              "https://api.hyperliquid-testnet.xyz/info",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  role = json.load(response)
          except Exception:
              fail("Could not verify agent association through Testnet Info API")
          if not isinstance(role, dict) or role.get("role") != "agent":
              fail("Testnet API wallet is not reported as an agent")
          owner = role.get("data", {}).get("user", "")
          if not isinstance(owner, str) or owner.lower() != account.lower():
              fail("Testnet agent does not belong to the expected account")
          print("PASS: Agent is linked to the expected Testnet account")
          print("PASS: Read-only verification complete; no orders submitted")
          PY
